async function hashPassword(pw) {
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

    filing: { score: 3, why: "TaxJar provides US filing but only for Stripe transactions. Non-Stripe revenue requires separate filing solution. NetSuite integration discontinued for new users. Incomplete compliance story." },
    exemptionCerts: { score: 2, why: "Lack of tools for capturing tax-exempt certificates per Capterra reviews. Basic handling at best. Not a product focus for Stripe." },
    internationalVat: { score: 4, why: "100+ country coverage via Stripe Tax. Broader than TaxJar\u2019s US-only. Strong for Stripe-processed international transactions but blind to non-Stripe channels." },
    saasSpecific: { score: 2, why: "Handles basic subscriptions within Stripe Billing. No support for usage-based billing, complex SaaS models, or multi-channel subscription management. Inflexible tax-inclusive/exclusive settings." },
    aiFeatures: { score: 1, why: "No meaningful AI features. Pure rules-based calculation engine. No AI-powered taxability, no conversational interface, no automated compliance intelligence." },
    easeOfUse: { score: 4, why: "Seamless if already on Stripe \u2014 zero-friction activation. Toggle-on simplicity is unmatched for Stripe users. Completely useless for non-Stripe transactions." },
    support: { score: 2, why: "Post-acquisition team instability (CEO, CRO, 45-55 employees lost). Merchants report longer wait times and lack of specialized tax knowledge. TaxJar support declining." },
    integrations: { score: 2, why: "Only works with Stripe. NetSuite integration discontinued for new users. No ERP, no competing billing platforms. By design, locks you into Stripe ecosystem." },
    pricing: { score: 4, why: "5\u00A2 per API call (Tax Basic) is simple and affordable for low-volume. Attractive entry point. But only covers Stripe transactions \u2014 you need a second solution for everything else." }
  }
};

function FeatureBar({ label, featureKey, anrokScore, compScore, compId, onClickBar }) {
  const delta = anrokScore - compScore;
  const deltaColor = delta > 0 ? "#10B981" : delta < 0 ? "#EF4444" : "#6B7280";
  const deltaText = delta > 0 ? `Anrok +${delta}` : delta < 0 ? `Behind ${Math.abs(delta)}` : "Even";
  return (
    <div style={{marginBottom:12,cursor:"pointer",padding:6,borderRadius:6,transition:"background 0.2s"}}
      onClick={() => onClickBar && onClickBar(featureKey)}
      onMouseOver={e => e.currentTarget.style.background="rgba(59,130,246,0.08)"}
      onMouseOut={e => e.currentTarget.style.background="transparent"}
      title="Click for detailed scoring rationale">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:12,color:"#d1d5db"}}>{label} <span style={{fontSize:10,color:"#4b5563"}}>{"\u{1F50D}"}</span></span>
        <span style={{fontSize:12,fontWeight:700,color:deltaColor}}>{deltaText}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <span style={{fontSize:11,color:"#60a5fa",width:44,textAlign:"right"}}>Anrok</span>
        <div className="bar-track"><div className="bar-blue" style={{width:`${(anrokScore/5)*100}%`}}/></div>
        <span style={{fontSize:11,color:"#9ca3af",width:16}}>{anrokScore}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4,marginTop:2}}>
        <span style={{fontSize:11,color:"#fb923c",width:44,textAlign:"right"}}>Comp</span>
        <div className="bar-track"><div className="bar-orange" style={{width:`${(compScore/5)*100}%`}}/></div>
        <span style={{fontSize:11,color:"#9ca3af",width:16}}>{compScore}</span>
      </div>
    </div>
  );
}

                        </div>
                      )}

                      <div style={{background:"rgba(31,41,55,0.3)",border:"1px solid rgba(55,65,81,0.3)",borderRadius:6,padding:10,marginTop:16}}>
                        <p style={{fontSize:11,color:"#4b5563",margin:0}}>Sources: G2, Capterra, TrustRadius, Shopify App Store, community reviews. All quotes marked verified. Last updated: {LAST_UPDATED}.</p>
                      </div>
                    </div>
                  )}
                  {detailTab === "churn" && (
                    <div>
                      <p style={{fontSize:12,color:"#6b7280",marginBottom:16}}>Verified churn signals, customer losses, and attrition indicators for {selectedComp.name}</p>
                      {(churnSignals[selectedComp.id] || []).length > 0 ? (
                        <div>
                          {churnSignals[selectedComp.id].map((s, i) => (
                            <div key={i} style={{background:"rgba(17,24,39,0.5)",border:"1px solid rgba(55,65,81,0.4)",borderRadius:8,padding:14,marginBottom:10,borderLeft:`3px solid ${(churnTypeLabels[s.type]||{}).color||"#6b7280"}`}}>
                              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                                <span style={{fontSize:11,fontFamily:"monospace",color:"#9ca3af",background:"rgba(31,41,55,0.8)",padding:"2px 8px",borderRadius:4}}>{s.date}</span>
                                <span style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:4,color:"#fff",background:(churnTypeLabels[s.type]||{}).color||"#6b7280"}}>{(churnTypeLabels[s.type]||{}).label||s.type}</span>
                              </div>
                              <p style={{fontSize:13,color:"#e5e7eb",lineHeight:1.6,margin:"0 0 8px"}}>{s.signal}</p>
                              <a href={s.sourceUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#60a5fa",textDecoration:"none",display:"inline-flex",alignItems:"center",gap:4}}>
                                {"\u{1F517}"} {s.source}
                                <span style={{fontSize:10,color:"#4b5563"}}>{"\u2197"}</span>
                              </a>
                            </div>
                          ))}
                          <div style={{background:"rgba(31,41,55,0.3)",border:"1px solid rgba(55,65,81,0.3)",borderRadius:6,padding:10,marginTop:12}}>
                            <p style={{fontSize:11,color:"#4b5563",margin:0}}>All churn signals are sourced from public earnings calls, review sites, case studies, and verified analyst reports. Click any source link to verify. Last updated: {LAST_UPDATED}.</p>
                          </div>
                        </div>
                      ) : (
                        <div style={{background:"rgba(17,24,39,0.4)",borderRadius:8,padding:20,textAlign:"center"}}>
                          <p style={{fontSize:14,color:"#6b7280",margin:"0 0 4px"}}>{"\u{1F50D}"} No churn signals found for {selectedComp.name}</p>
                          <p style={{fontSize:12,color:"#4b5563",margin:0}}>{selectedComp.id === "sphere" ? "Sphere is a newer entrant — limited public customer data available." : selectedComp.id === "fonoa" ? "Fonoa primarily serves EU/global markets — limited US churn data available." : "Check back after the next weekly refresh."}</p>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* ICP */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginTop:24}}>
                <div className="card" style={{padding:16}}>
                  <h4 style={{fontSize:13,fontWeight:600,color:"#4ade80",margin:"0 0 8px"}}>Their Sweet Spot (Where They Win)</h4>
                  <p style={{fontSize:13,color:"#d1d5db",margin:0}}>{selectedComp.idealFor}</p>
                </div>
                <div className="card" style={{padding:16}}>
                  <h4 style={{fontSize:13,fontWeight:600,color:"#f87171",margin:"0 0 8px"}}>Their Weakness (Where Anrok Wins)</h4>
                  <p style={{fontSize:13,color:"#d1d5db",margin:0}}>{selectedComp.notIdealFor}</p>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* HEATMAP */}
        {activeTab === "heatmap" && (
          <div className="card" style={{padding:20}}>
            <h3 style={{fontSize:18,fontWeight:600,margin:"0 0 8px"}}>Feature Comparison Heatmap</h3>
            <p style={{fontSize:12,color:"#9ca3af",marginBottom:16}}>Scores from 1 (weakest) to 5 (strongest). Green = strong, Red = weak.</p>
            <div style={{overflow:"auto"}}>
              <table style={{fontSize:12}}>
                <thead>
                  <tr>
                    <th style={{textAlign:"left",padding:"8px",color:"#9ca3af",fontWeight:500,position:"sticky",left:0,background:"#111827",zIndex:1}}>Feature</th>
                    {allForHeatmap.map(c => <th key={c.id} style={{padding:8,textAlign:"center",color:"#9ca3af",fontWeight:500,minWidth:70}}><div>{c.logo}</div><div style={{marginTop:2}}>{c.name}</div></th>)}
                  </tr>
                </thead>
                <tbody>
                  {featureKeys.map(k => (
                    <tr key={k} style={{borderTop:"1px solid #1f2937"}}>
                      <td style={{padding:8,color:"#d1d5db",fontWeight:500,position:"sticky",left:0,background:"#111827",zIndex:1}}>{featureLabels[k]}</td>
                      {allForHeatmap.map(c => (
                        <td key={c.id} style={{padding:8,textAlign:"center"}}>
                          <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:32,height:32,borderRadius:6,background:getHeatColor(c.features[k]),color:"#fff",fontWeight:700,fontSize:14}}>
                            {c.features[k]}
                          </span>
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{display:"flex",gap:8,marginTop:12,justifyContent:"center",alignItems:"center"}}>
              <span style={{fontSize:12,color:"#6b7280"}}>Score:</span>
              {[1,2,3,4,5].map(v => <div key={v} style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:16,height:16,borderRadius:4,background:getHeatColor(v),display:"inline-block"}}/><span style={{fontSize:12,color:"#9ca3af"}}>{v}</span></div>)}
            </div>
          </div>
        )}

        {/* BATTLECARD */}
        {activeTab === "battlecard" && (
          <div>
            <p style={{fontSize:14,color:"#9ca3af",marginBottom:16}}>Quick-reference battlecards for your AEs. Click to expand.</p>
            {competitors.map(comp => (
              <details key={comp.id} style={{marginBottom:8}}>
                <summary className="card" style={{padding:16,cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
                  <span style={{fontSize:18}}>{comp.logo}</span>
                  <span style={{fontWeight:600,color:"#fff"}}>{comp.name}</span>
                  <span className={`threat-${comp.threatLevel}`} style={{padding:"2px 8px",borderRadius:4,fontSize:12,fontWeight:500,marginLeft:8}}>{threatLabels[comp.threatLevel]}</span>
                  <span style={{marginLeft:"auto",fontSize:12,color:"#6b7280"}}>Click to expand</span>
                </summary>
                <div className="card" style={{padding:"0 16px 16px",borderTop:"1px solid #374151",marginTop:-1,borderTopLeftRadius:0,borderTopRightRadius:0}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24,marginTop:16}}>
                    <div>
                      <h4 style={{fontSize:13,fontWeight:600,color:"#4ade80",margin:"0 0 8px"}}>How Anrok Wins</h4>
                      {comp.anrokWins.slice(0,4).map((w,i) => <div key={i} style={{display:"flex",gap:8,padding:"4px 0"}}><span style={{color:"#22c55e",flexShrink:0}}>{"\u2713"}</span><p style={{fontSize:12,color:"#d1d5db",margin:0}}>{w}</p></div>)}
                    </div>
                    <div>
                      <h4 style={{fontSize:13,fontWeight:600,color:"#fbbf24",margin:"0 0 8px"}}>Watch Out For</h4>
                      {comp.strengths.slice(0,4).map((s,i) => <div key={i} style={{display:"flex",gap:8,padding:"4px 0"}}><span style={{color:"#eab308",flexShrink:0}}>{"\u26A1"}</span><p style={{fontSize:12,color:"#d1d5db",margin:0}}>{s}</p></div>)}
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginTop:16}}>
                    <div style={{background:"rgba(17,24,39,0.5)",borderRadius:6,padding:12}}>
                      <span style={{fontSize:11,color:"#6b7280"}}>Their Sweet Spot</span>
                      <p style={{fontSize:12,color:"#d1d5db",margin:"4px 0 0"}}>{comp.idealFor}</p>
                    </div>
                    <div style={{background:"rgba(17,24,39,0.5)",borderRadius:6,padding:12}}>
                      <span style={{fontSize:11,color:"#6b7280"}}>Pricing</span>
                      <p style={{fontSize:12,color:"#d1d5db",margin:"4px 0 0"}}>{comp.pricing} ({comp.pricingModel})</p>
                    </div>
                  </div>
                  <div style={{marginTop:12}}>
                    <span style={{fontSize:11,color:"#6b7280"}}>Quick Killer Line:</span>
                    <p style={{fontSize:14,color:"#93c5fd",fontStyle:"italic",margin:"4px 0 0"}}>"{comp.anrokWins[0]}"</p>
                  </div>
                </div>
              </details>
            ))}
          </div>
        )}

      </div>

      {/* Footer */}
      <div style={{borderTop:"1px solid #1f2937",background:"rgba(17,24,39,0.5)",marginTop:32}}>
        <div style={{maxWidth:1280,margin:"0 auto",padding:"16px",display:"flex",justifyContent:"space-between",fontSize:12,color:"#6b7280"}}>
          <span>Anrok Competitive Intelligence Dashboard \u00B7 Built for MM Sales</span>
          <span>Data sourced from G2, company websites, press releases, review sites \u00B7 {LAST_UPDATED}</span>
        </div>
      </div>
    </div>
  );
}

function AuthenticatedApp() {
  const [authed, setAuthed] = useState(false);
  if (!authed) return <PasswordGate onAuth={() => setAuthed(true)} />;
  return <App />;
}

ReactDOM.render(<AuthenticatedApp />, document.getElementById('root'));
</script>
</body>
</html>
