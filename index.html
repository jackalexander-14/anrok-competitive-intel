  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function CompanyLogo({ domain, size = 20, style = {} }) {

    alt: "",
    width: size,
    height: size,
    style: Object.assign({ borderRadius: 4, objectFit: "contain", verticalAlign: "middle", background: "#fff" }, style),

  });

function FeatureBar({ label, featureKey, anrokScore, compScore, compId, onClickBar }) {
  const delta = anrokScore - compScore;
  const deltaColor = delta > 0 ? "#10B981" : delta < 0 ? "#EF4444" : "#6B7280";
  const deltaText = delta > 0 ? `Anrok +${delta}` : delta < 0 ? `Behind ${Math.abs(delta)}` : "Even";
  return (
    <div style={{marginBottom:12,cursor:"pointer",padding:6,borderRadius:6,transition:"background 0.2s"}}
      onClick={() => onClickBar && onClickBar(featureKey)}
      onMouseOver={e => e.currentTarget.style.background="rgba(59,130,246,0.08)"}
      onMouseOut={e => e.currentTarget.style.background="transparent"}
      title="Click for detailed scoring rationale">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:12,color:"#d1d5db"}}>{label} <span style={{fontSize:10,color:"#4b5563"}}>{"\u{1F50D}"}</span></span>
        <span style={{fontSize:12,fontWeight:700,color:deltaColor}}>{deltaText}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <span style={{fontSize:11,color:"#60a5fa",width:44,textAlign:"right"}}>Anrok</span>
        <div className="bar-track"><div className="bar-blue" style={{width:`${(anrokScore/5)*100}%`}}/></div>
        <span style={{fontSize:11,color:"#9ca3af",width:16}}>{anrokScore}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4,marginTop:2}}>
        <span style={{fontSize:11,color:"#fb923c",width:44,textAlign:"right"}}>Comp</span>
        <div className="bar-track"><div className="bar-orange" style={{width:`${(compScore/5)*100}%`}}/></div>
        <span style={{fontSize:11,color:"#9ca3af",width:16}}>{compScore}</span>
      </div>
    </div>
  );
}

                  <CompanyLogo domain={comp.logoDomain} size={22} />
                  <span style={{fontWeight:600,color:"#fff"}}>{comp.name}</span>
                  <span className={`threat-${comp.threatLevel}`} style={{padding:"2px 8px",borderRadius:4,fontSize:12,fontWeight:500,marginLeft:8}}>{threatLabels[comp.threatLevel]}</span>
                  <span style={{marginLeft:"auto",fontSize:12,color:"#6b7280"}}>Click to expand</span>
                </summary>
                <div className="card" style={{padding:"0 16px 16px",borderTop:"1px solid #374151",marginTop:-1,borderTopLeftRadius:0,borderTopRightRadius:0}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24,marginTop:16}}>
                    <div>
                      <h4 style={{fontSize:13,fontWeight:600,color:"#4ade80",margin:"0 0 8px"}}>How Anrok Wins</h4>
                      {comp.anrokWins.slice(0,4).map((w,i) => <div key={i} style={{display:"flex",gap:8,padding:"4px 0"}}><span style={{color:"#22c55e",flexShrink:0}}>{"\u2713"}</span><p style={{fontSize:12,color:"#d1d5db",margin:0}}>{w}</p></div>)}
                    </div>
                    <div>
                      <h4 style={{fontSize:13,fontWeight:600,color:"#fbbf24",margin:"0 0 8px"}}>Watch Out For</h4>
                      {comp.strengths.slice(0,4).map((s,i) => <div key={i} style={{display:"flex",gap:8,padding:"4px 0"}}><span style={{color:"#eab308",flexShrink:0}}>{"\u26A1"}</span><p style={{fontSize:12,color:"#d1d5db",margin:0}}>{s}</p></div>)}
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginTop:16}}>
                    <div style={{background:"rgba(17,24,39,0.5)",borderRadius:6,padding:12}}>
                      <span style={{fontSize:11,color:"#6b7280"}}>Their Sweet Spot</span>
                      <p style={{fontSize:12,color:"#d1d5db",margin:"4px 0 0"}}>{comp.idealFor}</p>
                    </div>
                    <div style={{background:"rgba(17,24,39,0.5)",borderRadius:6,padding:12}}>
                      <span style={{fontSize:11,color:"#6b7280"}}>Pricing</span>
                      <p style={{fontSize:12,color:"#d1d5db",margin:"4px 0 0"}}>{comp.pricing} ({comp.pricingModel})</p>
                    </div>
                  </div>
                  <div style={{marginTop:12}}>
                    <span style={{fontSize:11,color:"#6b7280"}}>Quick Killer Line:</span>
                    <p style={{fontSize:14,color:"#93c5fd",fontStyle:"italic",margin:"4px 0 0"}}>"{comp.anrokWins[0]}"</p>
                  </div>
                  {objectionHandling[comp.id] && objectionHandling[comp.id].length > 0 && (
                    <div style={{marginTop:16,borderTop:"1px solid #374151",paddingTop:12}}>
                      <h4 style={{fontSize:13,fontWeight:600,color:"#f87171",margin:"0 0 8px"}}>{"\uD83D\uDEE1\uFE0F"} Objection Handling</h4>
                      {objectionHandling[comp.id].map((obj,i) => (
                        <div key={i} style={{marginBottom:10,background:"rgba(17,24,39,0.5)",borderRadius:6,padding:10}}>
                          <div style={{fontSize:12,fontWeight:600,color:"#fbbf24",marginBottom:4}}>"{obj.objection}"</div>
                          <div style={{fontSize:12,color:"#d1d5db"}}>{obj.response}</div>
                        </div>
                      ))}
                    </div>
                  )}
                  {landmineQuestions[comp.id] && landmineQuestions[comp.id].length > 0 && (
                    <div style={{marginTop:16,borderTop:"1px solid #374151",paddingTop:12}}>
                      <h4 style={{fontSize:13,fontWeight:600,color:"#a78bfa",margin:"0 0 8px"}}>{"\uD83D\uDCA3"} Landmine Questions (Ask the Prospect)</h4>
                      {landmineQuestions[comp.id].map((q,i) => (
                        <div key={i} style={{display:"flex",gap:8,padding:"4px 0"}}>
                          <span style={{color:"#a78bfa",flexShrink:0}}>{"\u2192"}</span>
                          <p style={{fontSize:12,color:"#d1d5db",margin:0}}>{q}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </details>
            ))}
          </div>
        )}

      </div>

      {/* Footer */}
      <div style={{borderTop:"1px solid #1f2937",background:"rgba(17,24,39,0.5)",marginTop:32}}>
        <div style={{maxWidth:1280,margin:"0 auto",padding:"16px",display:"flex",justifyContent:"space-between",fontSize:12,color:"#6b7280"}}>
          <span>Anrok Competitive Intelligence Dashboard · Built for MM Sales</span>
          <span>Data sourced from G2, company websites, press releases, review sites · {LAST_UPDATED}</span>
        </div>
      </div>
    </div>
  );
}

function AuthenticatedApp() {
  const [authed, setAuthed] = useState(false);
  if (!authed) return <PasswordGate onAuth={() => setAuthed(true)} />;
  return <App />;
}

ReactDOM.render(<AuthenticatedApp />, document.getElementById('root'));
</script>
</body>
</html>
